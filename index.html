<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Bot Royale</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0c101d; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; user-select: none; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; background: radial-gradient(circle at 50% 20%, #1c263f 0%, #0d1221 65%, #05070d 100%); cursor: crosshair; }
        
        /* Original Clean Arcade UI Overlay */
        .hud-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; pointer-events: auto; }
        
        .match-info { background: rgba(13, 18, 33, 0.85); border: 2px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 10px 20px; backdrop-filter: blur(8px); display: flex; gap: 24px; align-items: center; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        .match-stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 10px; text-transform: uppercase; color: #94a3b8; font-weight: 700; letter-spacing: 0.5px; }
        .stat-val { font-size: 18px; font-weight: 800; color: #f8fafc; }
        .stat-val.gold { color: #fbbf24; }
        
        .player-hud { background: rgba(13, 18, 33, 0.85); border: 2px solid #3b82f6; border-radius: 10px; padding: 10px 20px; backdrop-filter: blur(8px); display: flex; gap: 20px; align-items: center; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        
        .controls-hint { background: rgba(13, 18, 33, 0.8); border: 1px solid rgba(255,255,255,0.1); padding: 10px 16px; border-radius: 8px; font-size: 12px; color: #94a3b8; pointer-events: auto; backdrop-filter: blur(6px); }
        .controls-hint b { color: #f8fafc; }

        /* Game Over Modal */
        #gameOverScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 7, 15, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        #gameOverScreen.active { opacity: 1; pointer-events: auto; }
        .game-over-title { font-size: 48px; font-weight: 900; text-transform: uppercase; color: #ef4444; text-shadow: 0 4px 20px rgba(239, 68, 68, 0.4); letter-spacing: 2px; }
        .play-again-btn { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; border: none; padding: 14px 32px; font-size: 16px; font-weight: 900; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.5); transition: transform 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        .play-again-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="hud-overlay">
        <div class="top-bar">
            <div class="match-info">
                <div class="match-stat">
                    <span class="stat-label">Alive</span>
                    <span class="stat-val" id="aliveCount">25</span>
                </div>
                <div class="match-stat">
                    <span class="stat-label">Placement</span>
                    <span class="stat-val" id="placeVal">#1</span>
                </div>
            </div>
            
            <div class="player-hud">
                <div class="match-stat">
                    <span class="stat-label">Health</span>
                    <span class="stat-val" id="playerHp" style="color:#22c55e;">100</span>
                </div>
                <div class="match-stat">
                    <span class="stat-label">Coins</span>
                    <span class="stat-val gold" id="playerCoins">0</span>
                </div>
            </div>
        </div>
        
        <div class="controls-hint">
            <b>A / D</b>: Drive &nbsp;|&nbsp; <b>Mouse</b>: Aim Turret &nbsp;|&nbsp; <b>Left Click / Space</b>: Fire Rocket (Recoil Jump)
        </div>
    </div>

    <div id="gameOverScreen">
        <div class="game-over-title">Eliminated</div>
        <div style="font-size: 14px; color: #94a3b8;" id="placementResult">You finished in #12 place</div>
        <button class="play-again-btn" id="restartBtn">Play Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const CONFIG = {
            gravity: 0.35,
            seaRiseSpeed: 0.05
        };

        let currentSeaLevel = canvas.height - 60;
        let keys = { left: false, right: false };
        let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        let camera = { shake: 0 };

        // Destructible Islands (Classic green grass top + brown dirt body)
        let islands = [];

        function initIslands() {
            let w = canvas.width;
            let h = canvas.height;
            islands = [
                { x: w * 0.12, y: h * 0.42, width: w * 0.28, height: 160 },
                { x: w * 0.60, y: h * 0.42, width: w * 0.28, height: 160 },
                { x: w * 0.35, y: h * 0.22, width: w * 0.30, height: 140 },
                { x: w * 0.05, y: h * 0.64, width: w * 0.24, height: 140 },
                { x: w * 0.71, y: h * 0.64, width: w * 0.24, height: 140 },
                { x: w * 0.38, y: h * 0.78, width: w * 0.24, height: 110 }
            ];
        }
        initIslands();

        let player = {
            x: canvas.width * 0.5,
            y: canvas.height * 0.12,
            vx: 0,
            vy: 0,
            radius: 15,
            turretAngle: 0,
            hp: 100,
            maxHp: 100,
            coins: 0,
            alive: true,
            color: '#3b82f6',
            isPlayer: true
        };

        let bots = [];
        let projectiles = [];
        let particles = [];
        let floatingTexts = [];

        function spawnBots(count) {
            for (let i = 0; i < count; i++) {
                let isl = islands[Math.floor(Math.random() * islands.length)];
                bots.push({
                    x: isl.x + 30 + Math.random() * (isl.width - 60),
                    y: isl.y - 30,
                    vx: (Math.random() - 0.5) * 2,
                    vy: 0,
                    radius: 15,
                    turretAngle: 0,
                    hp: 100,
                    maxHp: 100,
                    color: '#ef4444',
                    aiTimer: 0,
                    shootTimer: 60 + Math.random() * 60,
                    isPlayer: false
                });
            }
        }
        spawnBots(24);

        window.addEventListener('keydown', e => {
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
            if (e.key === ' ' || e.key === 'ArrowUp') { fireRocket(player); e.preventDefault(); }
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
        });

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mousedown', () => {
            fireRocket(player);
        });

        function fireRocket(tank) {
            if (!tank.alive) return;
            let angle = tank.turretAngle;
            let speed = 12;

            projectiles.push({
                x: tank.x + Math.cos(angle) * 24,
                y: tank.y + Math.sin(angle) * 24,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: 4.5,
                isPlayer: tank.isPlayer
            });

            // Rocket jump recoil kickback
            if (tank.isPlayer) {
                tank.vx -= Math.cos(angle) * 6.5;
                tank.vy -= Math.sin(angle) * 6.5;
                createExplosionParticles(tank.x, tank.y, '#f59e0b', 12);
            }
        }

        function createExplosion(x, y, radius) {
            camera.shake = 10;

            [player, ...bots].forEach(t => {
                if (!t.alive) return;
                let dist = Math.hypot(t.x - x, t.y - y);
                if (dist < radius + t.radius) {
                    t.hp -= 40;
                    if (t.hp <= 0) {
                        t.hp = 0;
                        t.alive = false;
                        if (t.isPlayer) {
                            let aliveCount = 1 + bots.filter(b => b.alive).length;
                            document.getElementById('placementResult').innerText = `You finished in #${aliveCount} place`;
                            document.getElementById('gameOverScreen').classList.add('active');
                        } else {
                            player.coins += 250;
                            addFloatingText(t.x, t.y, "+250", "#fbbf24");
                        }
                    }
                }
            });

            // Carve terrain craters
            islands.forEach(isl => {
                let cx = Math.max(isl.x, Math.min(x, isl.x + isl.width));
                let cy = Math.max(isl.y, Math.min(y, isl.y + isl.height));
                if (Math.hypot(x - cx, y - cy) < radius) {
                    isl.height = Math.max(25, isl.height - radius * 0.35);
                }
            });

            createExplosionParticles(x, y, '#f97316', 25);
        }

        function createExplosionParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = 1 + Math.random() * 7;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: Math.random() > 0.5 ? color : '#facc15',
                    size: 2 + Math.random() * 4,
                    life: 20 + Math.random() * 15
                });
            }
        }

        function addFloatingText(x, y, text, color) {
            floatingTexts.push({ x, y, text, color, life: 35, vy: -1 });
        }

        function updateTank(tank) {
            if (!tank.alive) return;

            tank.vy += CONFIG.gravity;
            tank.x += tank.vx;
            tank.y += tank.vy;
            tank.vx *= 0.94;

            // Island Collision
            islands.forEach(isl => {
                if (tank.x >= isl.x && tank.x <= isl.x + isl.width) {
                    if (tank.y + tank.radius >= isl.y && tank.y - tank.radius <= isl.y + isl.height) {
                        if (tank.vy >= 0 && tank.y <= isl.y + 14) {
                            tank.y = isl.y - tank.radius;
                            tank.vy = 0;
                            tank.vx *= 0.8;
                        }
                    }
                }
            });

            if (tank.isPlayer) {
                if (keys.left) tank.vx -= 0.5;
                if (keys.right) tank.vx += 0.5;
                tank.turretAngle = Math.atan2(mouse.y - tank.y, mouse.x - tank.x);
            } else {
                tank.aiTimer++;
                if (tank.aiTimer > 75) {
                    tank.aiTimer = 0;
                    tank.vx = (Math.random() - 0.5) * 3.5;
                }
                let angleToPlayer = Math.atan2(player.y - tank.y, player.x - tank.x);
                tank.turretAngle = angleToPlayer;
                tank.shootTimer--;
                if (tank.shootTimer <= 0) {
                    tank.shootTimer = 70 + Math.random() * 60;
                    projectiles.push({
                        x: tank.x + Math.cos(angleToPlayer) * 24,
                        y: tank.y + Math.sin(angleToPlayer) * 24,
                        vx: Math.cos(angleToPlayer) * 11,
                        vy: Math.sin(angleToPlayer) * 11,
                        radius: 4.5,
                        isPlayer: false
                    });
                }
            }

            // Lava Sea hazard
            if (tank.y + tank.radius >= currentSeaLevel) {
                tank.hp -= 2;
                if (tank.hp <= 0) {
                    tank.hp = 0;
                    tank.alive = false;
                    if (tank.isPlayer) {
                        let aliveCount = 1 + bots.filter(b => b.alive).length;
                        document.getElementById('placementResult').innerText = `You finished in #${aliveCount} place`;
                        document.getElementById('gameOverScreen').classList.add('active');
                    }
                }
            }

            if (tank.x < 20) { tank.x = 20; tank.vx *= -0.5; }
            if (tank.x > canvas.width - 20) { tank.x = canvas.width - 20; tank.vx *= -0.5; }
        }

        function update() {
            currentSeaLevel -= CONFIG.seaRiseSpeed * 0.05;
            if (camera.shake > 0) camera.shake *= 0.85;

            updateTank(player);
            bots.forEach(b => updateTank(b));

            projectiles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += CONFIG.gravity * 0.25;

                let hit = false;
                islands.forEach(isl => {
                    if (p.x >= isl.x && p.x <= isl.x + isl.width && p.y >= isl.y && p.y <= isl.y + isl.height) {
                        hit = true;
                    }
                });

                if (hit || p.y >= currentSeaLevel) {
                    createExplosion(p.x, p.y, 32);
                    projectiles.splice(idx, 1);
                }
            });

            particles.forEach((pt, idx) => {
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.life--;
                if (pt.life <= 0) particles.splice(idx, 1);
            });

            floatingTexts.forEach((ft, idx) => {
                ft.y += ft.vy;
                ft.life--;
                if (ft.life <= 0) floatingTexts.splice(idx, 1);
            });

            let aliveCount = (player.alive ? 1 : 0) + bots.filter(b => b.alive).length;
            document.getElementById('aliveCount').innerText = aliveCount;
            document.getElementById('placeVal').innerText = '#' + aliveCount;
            document.getElementById('playerHp').innerText = Math.max(0, player.hp);
            document.getElementById('playerCoins').innerText = player.coins.toLocaleString();
        }

        // Exact original Rocket Bot Royale tank style (Caterpillar tracks + rounded hull + rotating gun)
        function drawTank(t) {
            if (!t.alive) return;
            ctx.save();
            ctx.translate(t.x, t.y);

            // Caterpillar Tracks
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.roundRect(-t.radius - 2, 5, t.radius * 2 + 4, 10, 4);
            ctx.fill();

            // Armored Hull Body
            ctx.fillStyle = t.color;
            ctx.beginPath();
            ctx.roundRect(-t.radius, -7, t.radius * 2, 14, 6);
            ctx.fill();

            // Turret & Cannon Barrel
            ctx.rotate(t.turretAngle);
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, -4, 24, 8);
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fillStyle = t.color;
            ctx.fill();

            ctx.restore();

            // Mini Health bar above tank
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(t.x - 18, t.y - 26, 36, 5);
            ctx.fillStyle = t.isPlayer ? '#3b82f6' : '#ef4444';
            ctx.fillRect(t.x - 18, t.y - 26, 36 * (t.hp / t.maxHp), 5);
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            if (camera.shake > 0.5) {
                ctx.translate((Math.random() - 0.5) * camera.shake, (Math.random() - 0.5) * camera.shake);
            }

            // Islands (Brown earth body + Green grass top)
            islands.forEach(isl => {
                ctx.fillStyle = '#291d17';
                ctx.fillRect(isl.x, isl.y, isl.width, isl.height);
                ctx.fillStyle = '#4ade80';
                ctx.fillRect(isl.x, isl.y, isl.width, 6);
            });

            // Rising Lava Sea
            ctx.fillStyle = 'rgba(239, 68, 68, 0.4)';
            ctx.fillRect(0, currentSeaLevel, canvas.width, canvas.height - currentSeaLevel);
            ctx.fillStyle = '#f97316';
            ctx.fillRect(0, currentSeaLevel, canvas.width, 6);

            // Tanks & Projectiles
            drawTank(player);
            bots.forEach(b => drawTank(b));

            projectiles.forEach(p => {
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            particles.forEach(pt => {
                ctx.fillStyle = pt.color;
                ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
            });

            ctx.font = 'bold 12px Segoe UI';
            floatingTexts.forEach(ft => {
                ctx.fillStyle = ft.color;
                ctx.fillText(ft.text, ft.x - 20, ft.y);
            });

            ctx.restore();
        }

        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);

        document.getElementById('restartBtn').addEventListener('click', () => {
            player.hp = player.maxHp;
            player.alive = true;
            player.x = canvas.width * 0.5;
            player.y = canvas.height * 0.12;
            player.vx = 0; player.vy = 0;
            currentSeaLevel = canvas.height - 60;
            initIslands();
            bots = [];
            spawnBots(24);
            document.getElementById('gameOverScreen').classList.remove('active');
        });
    </script>
</body>
</html>
